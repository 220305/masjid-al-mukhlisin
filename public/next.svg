<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#043627"/>
      <stop offset="100%" stop-color="#022117"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)"/>
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="3 3"/>

  <!-- Crescent Moon and Finial on Top -->
  <g filter="url(#glow)">
    <!-- Crescent Moon -->
    <path d="M64 15 C65.8 15 67.4 15.6 68.6 16.7 C66.2 17.8 64.6 20.3 64.6 23.2 C64.6 27 67.6 30 71.4 30 C72.8 30 74.1 29.5 75.2 28.7 C74 32.5 70.3 35.2 66 35.2 C60.8 35.2 56.6 31 56.6 25.8 C56.6 19.8 59.8 15 64 15 Z" fill="url(#goldGrad)"/>
    <!-- Spire Needle -->
    <rect x="62.5" y="32" width="3" height="11" rx="1.5" fill="url(#goldGrad)"/>
    <circle cx="64" cy="38" r="3" fill="url(#goldGrad)"/>

    <!-- Main Onion Dome -->
    <path d="M64 42 C54 50 36 59 36 78 C36 86 44 91 64 91 C84 91 92 86 92 78 C92 59 74 50 64 42 Z" fill="url(#domeGrad)" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Left & Right Minarets -->
    <path d="M28 72 L33 72 L33 97 L28 97 Z" fill="#047857" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <path d="M27.5 72 L30.5 64 L33.5 72 Z" fill="url(#goldGrad)"/>
    <path d="M95 72 L100 72 L100 97 L95 97 Z" fill="#047857" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <path d="M94.5 72 L97.5 64 L100.5 72 Z" fill="url(#goldGrad)"/>

    <!-- Center Arch Portal / Doorway -->
    <path d="M52 91 V72 C52 65.4 57.4 60 64 60 C70.6 60 76 65.4 76 72 V91 Z" fill="#022c22" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <path d="M56 91 V74 C56 69.6 59.6 66 64 66 C68.4 66 72 69.6 72 74 V91 Z" fill="#011b13"/>

    <!-- Foundation Steps -->
    <rect x="22" y="97" width="84" height="5" rx="2.5" fill="url(#goldGrad)"/>
    <rect x="18" y="104" width="92" height="4" rx="2" fill="#059669"/>
  </g>
</svg>
